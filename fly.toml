# Fly.io app config for the Racquet Collective API (docs/deploy.md has the full setup).
#
# Phase 1 (pre-payments): one Machine that Fly stops when idle and starts on the next request,
# so it only bills while serving traffic. Nothing polls the jobs table while it is stopped,
# so a scheduled "tick" Machine drains due jobs hourly (see docs/deploy.md; it is created
# with `fly machine run`, not from this file, and the deploy workflow keeps its image current).
# Secrets (DATABASE_URL, RESEND_API_KEY, BACKUP_*, ...) live in `fly secrets`, never here.

# CHANGE ME: app names are global on Fly, so "racquetcollective" is probably taken.
app = "racquetcollective"
# CHANGE ME: pick the region closest to your Neon project (`fly platform regions`).
primary_region = "ams"

# `serve` handles SIGTERM and SIGINT with a graceful shutdown that waits for the job loop.
kill_signal = "SIGTERM"
kill_timeout = 15

[deploy]
# Runs in a temporary Machine with the app's secrets before new Machines roll out; a failed
# migration aborts the deploy and leaves the running version untouched.
release_command = "racquetcollective-server migrate"

# Non-secret settings (names from crates/server/src/config.rs and db.rs). Anything sensitive or
# specific to one deployment goes through `fly secrets set` instead (docs/deploy.md).
# The deploy workflow copies the RACQUETCOLLECTIVE_* values below onto the tick Machine as well.
[env]
RACQUETCOLLECTIVE_BIND = "0.0.0.0:8080"
RACQUETCOLLECTIVE_LOG_FORMAT = "json"
# Fly's proxy sets `Fly-Client-IP`; trust only that header for per-IP auth rate limits.
RACQUETCOLLECTIVE_CLIENT_IP_SOURCE = "FlyClientIp"
RACQUETCOLLECTIVE_COOKIE_SECURE = "true"
RACQUETCOLLECTIVE_MAILER = "resend"
RACQUETCOLLECTIVE_PUSH = "expo"
# `{slug}.{base domain}` hosts resolve to communities; change if you do not own racquetcollective.app.
RACQUETCOLLECTIVE_BASE_DOMAIN = "racquetcollective.app"
# Neon's pooled endpoint multiplexes client connections, so a small pool is plenty.
RACQUETCOLLECTIVE_DB_MAX_CONNECTIONS = "5"
# DATABASE_URL is Neon's pooled (transaction-mode) endpoint; `migrate` then insists on
# DATABASE_DIRECT_URL. Set to "false" in Phase 2 (direct Postgres).
RACQUETCOLLECTIVE_DB_POOLED = "true"
# While awake the Machine drains jobs itself; poll gently (the hourly tick covers the rest).
RACQUETCOLLECTIVE_JOB_POLL_MS = "5000"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

  [http_service.concurrency]
  type = "requests"
  soft_limit = 25
  hard_limit = 50

  # Liveness only. /readyz queries the database, which would wake Neon on every check.
  [[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
# argon2id password hashing uses ~19 MiB per concurrent hash; 256 MB is too tight for bursts.
memory = "512mb"
