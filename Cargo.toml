[workspace]
resolver = "3"
members = ["crates/domain", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# Strict lint set borrowed from init4's spellbook, jay and signet-sdk, merged with the unified
# Rust conventions (AGENTS.md; decision 107). CI runs clippy and rustdoc with `-D warnings`, so
# every `warn` here fails the build. Silence a lint locally with
# `#[expect(lint, reason = "...")]`, never a bare `allow`.
[workspace.lints.rust]
closure_returning_async_block = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
tail_expr_drop_order = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Idioms and hygiene (selected nursery/pedantic/restriction lints).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
duration_suboptimal_units = "warn"
empty_enum_variants_with_brackets = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
float_cmp = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
items_after_statements = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_futures = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_clamp = "warn"
manual_ilog2 = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
map_with_unused_argument_over_ranges = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
min_ident_chars = "warn"
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
mod_module_files = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
nonminimal_bool = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
redundant_type_annotations = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_only_used_in_recursion = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
todo = "warn"
too_many_lines = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unseparated_literal_suffix = "warn"
unused_async = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unwrap_used = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"
# Type-driven design.
fn_params_excessive_bools = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
partial_pub_fields = "warn"
ref_option = "warn"
return_self_not_must_use = "warn"
struct_excessive_bools = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
# The unified conventions allow these three; this repo had them on and keeps the stricter
# setting (`cognitive-complexity-threshold` is tuned in clippy.toml).
cognitive_complexity = "warn"
needless_collect = "warn"
significant_drop_in_scrutinee = "warn"
# Explicitly allowed: noisy or known false positives.
as_ptr_cast_mut = "allow"
debug_assert_with_mut_call = "allow"
fallible_impl_from = "allow"
future_not_send = "allow"
non_send_fields_in_send_ty = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
too_long_first_doc_paragraph = "allow"

[workspace.dependencies]
racquetcollective-domain = { path = "crates/domain" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
axum = { version = "0.8", features = ["macros"] }
axum-client-ip = "1"
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
email_address = "0.2"
governor = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-float"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "macros", "migrate", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
percent-encoding = "2"
subtle = "2"
moka = { version = "0.12", features = ["future"] }
password-auth = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid", "chrono", "decimal_float"] }
uuid = { version = "1", features = ["v7", "serde"] }
utoipa-axum = "0.2"
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "set-header", "util"] }

# Password and token hashing are deliberately expensive / hot; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
