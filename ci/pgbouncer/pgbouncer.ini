; pgbouncer for the pooled CI job and local pooled test runs (see docs/deploy.md).
; It stands in for Neon's pooler: transaction pooling with protocol-level prepared statements.
; Ports: clients connect to 6432, Postgres listens on 5432. Local runs against another cluster
; rewrite them, e.g. `sed 's/6432/6427/; s/port=5432/port=5427/'` (docs/deploy.md).

[databases]
; Wildcard: every database, including the per-test ones the harness creates, goes to Postgres.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =

; Test-only credentials: the same `racquetcollective/racquetcollective` the CI Postgres service uses. The password
; is stored in clear so pgbouncer can both verify clients and log in to Postgres with SCRAM.
auth_type = scram-sha-256
auth_file = userlist.txt
admin_users = racquetcollective

pool_mode = transaction
; Neon's pgbouncer tracks protocol-level prepared statements. Set to 0 to test a pooler without.
max_prepared_statements = 200

; Every test owns a database, hence its own pool. Keep few, short-lived server connections so
; ~100 databases don't exhaust Postgres' max_connections, and idle ones let go of a database
; quickly so the harness can drop stale test databases.
max_client_conn = 1000
default_pool_size = 4
max_user_connections = 60
server_idle_timeout = 2
server_lifetime = 300

; sqlx sends extra_float_digits at startup; pgbouncer rejects startup parameters it doesn't
; know unless they are listed here.
ignore_startup_parameters = extra_float_digits

; No logfile/pidfile: run it from this directory (auth_file is relative to the working
; directory) in the background; it logs to stdout.
log_connections = 0
log_disconnections = 0
