name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DATABASE_URL: postgres://courtpit:courtpit@localhost:5432/courtpit

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: courtpit
          POSTGRES_PASSWORD: courtpit
          POSTGRES_DB: courtpit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courtpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci
        working-directory: packages/api-client
      - run: npm run gen
        working-directory: packages/api-client
      - name: Committed client matches the server's OpenAPI document
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is out of date. Run 'npm run gen' in packages/api-client and commit the result."
            exit 1
          fi
      - run: npm run typecheck
        working-directory: packages/api-client

  # The whole suite again through pgbouncer in transaction-pooling mode, the way production
  # reaches Neon's pooled endpoint. App pools use the pooler; admin work (migrations, the
  # advisory lock, CREATE/DROP DATABASE) uses the direct Postgres URL.
  test-pooled:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://courtpit:courtpit@127.0.0.1:6432/courtpit
      DATABASE_DIRECT_URL: postgres://courtpit:courtpit@127.0.0.1:5432/courtpit
      COURTPIT_DB_POOLED: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: courtpit
          POSTGRES_PASSWORD: courtpit
          POSTGRES_DB: courtpit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courtpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start pgbouncer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          # The package starts its own instance on 6432; ours replaces it.
          sudo systemctl stop pgbouncer || true
          cd ci/pgbouncer
          nohup /usr/sbin/pgbouncer pgbouncer.ini > "$RUNNER_TEMP/pgbouncer.log" 2>&1 &
          for _ in $(seq 30); do
            PGPASSWORD=courtpit psql "$DATABASE_URL" -Atc 'select 1' && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/pgbouncer.log"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: pgbouncer log
        if: failure()
        run: cat "$RUNNER_TEMP/pgbouncer.log"
