[package]
name = "racquetcollective-domain"
description = "Pure Racquet Collective domain logic: scores, match state, pairings, scoring. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derive utoipa::ToSchema on public types so the server can expose them in OpenAPI.
openapi = ["dep:utoipa"]

[dependencies]
rust_decimal = { workspace = true }
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
